<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AudioEX</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="app-header">
        <div>
          <h1>AudioEX</h1>
          <p>Audio controls for this tab</p>
        </div>
        <span id="status" class="status" data-active="false" aria-live="polite">Off</span>
      </header>

      <button id="capture-toggle" class="capture-button" type="button">
        Enable on this tab
      </button>
      <p id="capture-hint" class="hint">Settings are remembered for the next enabled tab.</p>
      <p id="error" class="error" role="alert" hidden></p>

      <section class="effect" id="equalizer-section">
        <div class="effect-heading">
          <label class="feature-toggle">
            <input id="equalizer-enabled" type="checkbox">
            <span>10-band equalizer</span>
          </label>
          <button id="equalizer-reset" class="text-button" type="button">Reset</button>
        </div>
        <div id="equalizer-controls" class="effect-controls equalizer-controls"></div>
      </section>

      <section class="effect" id="compressor-section">
        <label class="feature-toggle">
          <input id="compressor-enabled" type="checkbox">
          <span>Compressor / soft limiter</span>
        </label>
        <div class="effect-controls">
          <label class="control-row" for="compressor-threshold">
            <span>Threshold</span>
            <input id="compressor-threshold" type="range" min="-24" max="-1" step="0.5">
            <output id="compressor-threshold-value" for="compressor-threshold"></output>
          </label>
          <label class="control-row" for="compressor-ratio">
            <span>Ratio</span>
            <input id="compressor-ratio" type="range" min="2" max="20" step="1">
            <output id="compressor-ratio-value" for="compressor-ratio"></output>
          </label>
        </div>
      </section>

      <section class="effect" id="amplifier-section">
        <label class="feature-toggle">
          <input id="amplifier-enabled" type="checkbox">
          <span>Volume amplifier</span>
        </label>
        <div class="effect-controls">
          <label class="control-row" for="amplifier-gain">
            <span>Boost</span>
            <input id="amplifier-gain" type="range" min="0" max="12" step="0.5">
            <output id="amplifier-gain-value" for="amplifier-gain"></output>
          </label>
        </div>
      </section>

      <section class="effect" id="mono-section">
        <label class="feature-toggle">
          <input id="mono-enabled" type="checkbox">
          <span>Mono audio</span>
        </label>
        <div class="effect-controls">
          <label class="select-row" for="mono-mode">
            <span>Mode</span>
            <select id="mono-mode">
              <option value="copy-left">Copy L to R</option>
              <option value="copy-right">Copy R to L</option>
              <option value="sum">Sum L + R (normalized)</option>
            </select>
          </label>
        </div>
      </section>

      <footer>Audio stays on this device.</footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
